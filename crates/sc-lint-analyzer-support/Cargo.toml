[package]
name = "sc-lint-analyzer-support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Shared AST scanning and text-rendering support for sc-lint analyzers."
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[lib]
name = "sc_lint_analyzer_support"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
cargo_metadata.workspace = true
proc-macro2 = { version = "1", features = ["span-locations"] }
sc-lint-schema.workspace = true
serde.workspace = true
syn = { version = "2", features = ["full", "parsing", "visit"] }
