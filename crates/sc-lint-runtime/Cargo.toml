[package]
name = "sc-lint-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "AST-sensitive Rust runtime analyzer."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/sc-lint-runtime/0.8.5"
keywords = ["rust", "sc-lint", "lint", "runtime", "concurrency"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "sc-lint-runtime"
path = "src/main.rs"

[lib]
name = "sc_lint_runtime"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
sc-lint-schema.workspace = true
sc-lint-directives.workspace = true
sc-lint-analyzer-support.workspace = true
proc-macro2.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
syn = { version = "3.0.9", features = ["full", "parsing", "visit"] }
thiserror = "2.0.21"

[dev-dependencies]
sc-docli = "=0.2.0"
dunce = "1.0.5"
tempfile = "3.27.0"
