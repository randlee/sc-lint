[package]
name = "sc-lint-attributes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Source-level declarative attributes for sc-lint analyzers."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/sc-lint-attributes/0.8.8"
keywords = ["rust", "sc-lint", "attributes", "proc-macro", "lint"]
categories = ["development-tools", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
sc-lint-directives.workspace = true
proc-macro2.workspace = true
quote = "1.0.47"
syn = { version = "3.0.9", features = ["full", "parsing"] }
