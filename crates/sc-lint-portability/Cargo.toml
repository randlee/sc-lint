[package]
name = "sc-lint-portability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "AST-sensitive Rust portability analyzer."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/sc-lint-portability/0.8.9"
keywords = ["rust", "sc-lint", "lint", "portability", "cross-platform"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "sc-lint-portability"
path = "src/main.rs"

[lib]
name = "sc_lint_portability"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
sc-lint-schema.workspace = true
sc-lint-directives.workspace = true
sc-lint-analyzer-support.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
toml.workspace = true
syn = { version = "3.0.9", features = ["full", "parsing", "visit"] }
thiserror = "2.0.21"

[dev-dependencies]
sc-docli = "=0.2.0"
tempfile = "3.27.0"
