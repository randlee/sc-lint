[tool.sc-lint]
minimum_version = "{{SC_LINT_VERSION}}"

[[tool.sc-lint.lint]]
name = "fmt"
command = ["cargo", "fmt", "--all", "--check"]

[[tool.sc-lint.lint]]
name = "clippy"
command = ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]

[[tool.sc-lint.test]]
name = "workspace"
command = ["cargo", "test", "--workspace"]
