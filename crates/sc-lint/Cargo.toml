[package]
name = "sc-lint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Top-level CLI composition root for the sc-lint tool family."
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/sc-lint/0.8.6"
keywords = ["rust", "lint", "static-analysis", "code-quality", "repository-policy"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "sc-lint"
path = "src/main.rs"

[lib]
name = "sc_lint"
path = "src/lib.rs"

[dependencies]
clap.workspace = true
dunce = "1.0.5"
etcetera.workspace = true
sc-observability.workspace = true
sc-lint-boundary.workspace = true
sc-lint-schema.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
sha2 = "0.10.9"
toml.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
sc-docli = "=0.2.0"
serial_test = "4.0.1"
tempfile = "3.27.0"
