name: Wyvern F.3b capability smoke

on:
  workflow_dispatch:
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            archive: wyvern_0.6.0_x86_64-unknown-linux-gnu.tar.gz
          - os: macos-14
            archive: wyvern_0.6.0_aarch64-apple-darwin.tar.gz
          - os: macos-13
            archive: wyvern_0.6.0_x86_64-apple-darwin.tar.gz
          - os: windows-latest
            archive: wyvern_0.6.0_x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Download immutable release assets
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          base="https://github.com/randlee/wyvern/releases/download/v0.6.0"
          curl --fail --location --retry 3 --output "$ARCHIVE" "$base/$ARCHIVE"
          curl --fail --location --retry 3 --output checksums.txt "$base/checksums.txt"
          python - "$ARCHIVE" <<'PY'
          import hashlib
          import pathlib
          import sys

          archive = pathlib.Path(sys.argv[1])
          expected = next(
              line.split()[0]
              for line in pathlib.Path("checksums.txt").read_text().splitlines()
              if line.split()[-1] == archive.name
          )
          actual = hashlib.file_digest(archive.open("rb"), "sha256").hexdigest()
          if actual != expected:
              raise SystemExit(f"checksum mismatch for {archive}: {actual} != {expected}")
          print(f"SHA-256 verified: {archive.name} {actual}")
          PY
      - name: Extract release archive and run protocol matrix
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          python - "$ARCHIVE" <<'PY'
          import pathlib
          import sys
          import tarfile
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          if archive.suffix == ".zip":
              with zipfile.ZipFile(archive) as source:
                  source.extractall("release")
          else:
              with tarfile.open(archive) as source:
                  source.extractall("release")
          PY
          binary="$(find release -type f \( -name wyvern -o -name wyvern.exe \) -print -quit)"
          test -n "$binary"
          python docs/sc-lint/configure-wizard-fixtures/wyvern-smoke/run_smoke.py --binary "$binary"
