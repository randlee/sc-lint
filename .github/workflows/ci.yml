name: CI

on:
  pull_request:
    branches: [develop, main, "integrate/*", "integration/*", "sprint/*"]
  push:
    branches: [develop, main]

jobs:
  just-lint:
    name: Just lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: clippy, rustfmt

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install just
        run: cargo install just --locked

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: Install cargo-shear
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-shear@1.13.3

      - name: Install cargo-binstall
        uses: taiki-e/install-action@cargo-binstall

      - name: Install cargo-modules
        run: cargo binstall cargo-modules@0.26.0 --no-confirm

      - name: Install codespell
        run: python -m pip install codespell

      - name: Run just lint
        run: just lint

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: clippy, rustfmt

      - name: Install just
        run: cargo install just --locked

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run just setup
        run: just setup

      - name: Run just test
        run: just test

  adoption:
    name: Adoption kit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install just and pytest
        shell: bash
        run: |
          cargo install just --locked
          python -m pip install pytest
      - name: Run adoption kit tests
        run: just test-adoption

  release-smoke:
    # G.3b: the released archive must run every kit recipe with no source-tree
    # helper. Stages the archive exactly like release.yml, then drives
    # tests/fixtures/adoption/empty-workspace through `sc-lint init --just`,
    # `just setup/lint/test`, and the bootstrap upgrade check with no `.just/`.
    name: Release smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_ARTIFACT_MANIFEST: release/publish-artifacts.toml
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: clippy, rustfmt

      - name: Install just
        run: cargo install just --locked

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-release-smoke-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          bin_args="$(python3 scripts/release_artifacts.py cargo-build-bin-args --manifest "${RELEASE_ARTIFACT_MANIFEST}")"
          cargo build --release ${bin_args}

      - name: Build the sc_lint wheel and its dependencies for offline install
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet maturin==1.9.4
          python -m pip wheel --wheel-dir "${RUNNER_TEMP}/wheels" bindings/sc-lint-py

      - name: Stage and package the release archive
        shell: bash
        run: |
          set -euo pipefail
          docs_source="$(python3 scripts/release_artifacts.py documentation-source-directory --manifest "${RELEASE_ARTIFACT_MANIFEST}")"
          staging="${RUNNER_TEMP}/release-staging"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            python3 scripts/release_artifacts.py stage-release-archive \
              --manifest "${RELEASE_ARTIFACT_MANIFEST}" \
              --binaries-directory target/release \
              --documentation-directory "${docs_source}" \
              --staging-directory "${staging}" --windows
            archive="${RUNNER_TEMP}/sc-lint-smoke.zip"
            python3 -c "import shutil,sys; shutil.make_archive(sys.argv[1][:-4], 'zip', sys.argv[2])" "${archive}" "${staging}"
          else
            python3 scripts/release_artifacts.py stage-release-archive \
              --manifest "${RELEASE_ARTIFACT_MANIFEST}" \
              --binaries-directory target/release \
              --documentation-directory "${docs_source}" \
              --staging-directory "${staging}"
            archive="${RUNNER_TEMP}/sc-lint-smoke.tar.gz"
            COPYFILE_DISABLE=1 tar czf "${archive}" -C "${staging}" .
          fi
          windows_flag=""
          [[ "${RUNNER_OS}" == "Windows" ]] && windows_flag="--windows"
          python3 scripts/release_artifacts.py validate-release-archive \
            --manifest "${RELEASE_ARTIFACT_MANIFEST}" --archive "${archive}" ${windows_flag}
          echo "SMOKE_ARCHIVE=${archive}" >> "$GITHUB_ENV"

      - name: Run the release-archive smoke test
        shell: bash
        run: python3 scripts/release_smoke.py --archive "${SMOKE_ARCHIVE}" --wheel-dir "${RUNNER_TEMP}/wheels"
