name: Release Native Verify

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag (for example v0.8.3)"
        required: true
        type: string
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

jobs:
  plan:
    permissions:
      contents: read
      actions: read
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    outputs:
      verify: ${{ steps.plan.outputs.verify }}
      tag: ${{ steps.plan.outputs.tag }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Select the exact release and native targets from its manifest
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python .github/scripts/release_native_verify.py plan --tag "$RELEASE_TAG" --run-id "$RELEASE_RUN_ID" --output "$GITHUB_OUTPUT"

  native:
    if: ${{ needs.plan.outputs.verify == 'true' }}
    needs: plan
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      # The verifier needs Python 3.11+ (tomllib); the wheel is installed and run
      # under the target's Python from the matrix, which may be 3.9.
      - uses: actions/setup-python@v6
        id: tooling
        with:
          python-version: "3.13"
      - uses: actions/setup-python@v6
        id: wheel
        with:
          python-version: ${{ matrix.python_version }}
          architecture: ${{ matrix.python_arch }}
      - name: Verify native archive binaries and pip-installed wheel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_TARGET: ${{ matrix.target }}
          TOOLING_PYTHON: ${{ steps.tooling.outputs.python-path }}
          WHEEL_PYTHON: ${{ steps.wheel.outputs.python-path }}
        run: >-
          "$TOOLING_PYTHON" .github/scripts/release_native_verify.py verify
          --tag "$RELEASE_TAG" --target "$RELEASE_TARGET" --wheel-python "$WHEEL_PYTHON"
