name: Release Native Verify
# The run title names the tag and the commit the run verifies, so release-preflight accepts only
# a run for the prerelease's current commit. For a Release run the first field is its triggering
# branch; the report names the tag the plan resolved.
run-name: Release Native Verify ${{ inputs.tag || github.event.workflow_run.head_branch }} ${{ inputs.commit || github.event.workflow_run.head_sha }}

# Verifies a published release (Release) and a prerelease (Prerelease Archive) on
# the native matrix. A prerelease run gates its publish: see release/README.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag (for example v0.8.3) or prerelease tag (for example prerelease/v0.8.3)"
        required: true
        type: string
      commit:
        description: "Full commit SHA the tag names; the run verifies that commit and titles itself with it"
        required: true
        type: string
  workflow_run:
    workflows: [Release, Prerelease Archive]
    types: [completed]

permissions:
  contents: read

jobs:
  plan:
    permissions:
      contents: read
      actions: read
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    outputs:
      verify: ${{ steps.plan.outputs.verify }}
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
      targets: ${{ steps.plan.outputs.targets }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Select the exact release and native targets from its manifest
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit || github.event.workflow_run.head_sha }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_RUN_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: >-
          python .github/scripts/release_native_verify.py plan --tag "$RELEASE_TAG"
          --commit "$RELEASE_COMMIT" --run-id "$RELEASE_RUN_ID" --workflow "$RELEASE_RUN_WORKFLOW"
          --output "$GITHUB_OUTPUT"

  native:
    if: ${{ needs.plan.outputs.verify == 'true' }}
    needs: plan
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      # The verifier needs Python 3.11+ (tomllib); the wheel is installed and run
      # under the target's Python from the matrix, which may be 3.9.
      - uses: actions/setup-python@v6
        id: tooling
        with:
          python-version: "3.13"
      - uses: actions/setup-python@v6
        id: wheel
        with:
          python-version: ${{ matrix.python_version }}
          architecture: ${{ matrix.python_arch }}
      - name: Verify native archive binaries and pip-installed wheel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_TARGET: ${{ matrix.target }}
          TOOLING_PYTHON: ${{ steps.tooling.outputs.python-path }}
          WHEEL_PYTHON: ${{ steps.wheel.outputs.python-path }}
        run: >-
          "$TOOLING_PYTHON" .github/scripts/release_native_verify.py verify
          --tag "$RELEASE_TAG" --target "$RELEASE_TARGET" --wheel-python "$WHEEL_PYTHON"
          --result "native-results/${RELEASE_TARGET}.json"
      - name: Upload the native result for the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-results-${{ matrix.target }}
          path: native-results/${{ matrix.target }}.json
          if-no-files-found: warn

  report:
    # Renders one panel per target into a durable report, even when a target failed.
    name: Render native verification report
    if: ${{ always() && needs.plan.outputs.verify == 'true' }}
    needs: [plan, native]
    runs-on: ubuntu-latest
    env:
      EVENT_NAME: ${{ github.event_name }}
      SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      TARGETS: ${{ needs.plan.outputs.targets }}
      COMMIT: ${{ needs.plan.outputs.commit }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Download native results
        uses: actions/download-artifact@v4
        with:
          pattern: native-results-*
          path: native-results
          merge-multiple: true
      - name: Provision the pinned sc-compose renderer
        id: renderer
        run: |
          set -euo pipefail
          renderer="$(python .github/scripts/bootstrap_sc_compose.py --venv "$RUNNER_TEMP/sc-compose-venv")"
          echo "python-path=${renderer}" >> "$GITHUB_OUTPUT"
      - name: Render the native verification report
        id: report
        env:
          RENDERER_PYTHON: ${{ steps.renderer.outputs.python-path }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            trigger="workflow_dispatch with tag ${RELEASE_TAG}"
          else
            trigger="workflow_run of ${SOURCE_WORKFLOW} run ${SOURCE_RUN_ID}"
          fi
          report="$("$RENDERER_PYTHON" .github/scripts/release_native_report.py \
            --results-dir native-results --expected-targets "$TARGETS" \
            --tag "$RELEASE_TAG" --source-workflow "${SOURCE_WORKFLOW:-workflow_dispatch}" --commit "$COMMIT" \
            --run-id "$GITHUB_RUN_ID" --run-url "$RUN_URL" \
            --trigger "$trigger" --site-root site/reports/release-native-verify)"
          echo "report=${report}" >> "$GITHUB_OUTPUT"
          printf 'Native verification report: `%s`\n' "$report" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the rendered report
        uses: actions/upload-artifact@v4
        with:
          name: native-verify-report
          path: site/reports/release-native-verify
          if-no-files-found: error
