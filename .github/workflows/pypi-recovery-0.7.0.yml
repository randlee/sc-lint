name: Publish PyPI (one-time 0.7.0 recovery)

# One-time consumer recovery for v0.7.0 only. Delete this file after the
# production upload succeeds.
#
# The kit's pypi-publish.yml checks out the release tag, so it verifies with
# the tag's manifest. The v0.7.0 manifest declares a platform for the Linux
# wheel only, so the kit's unchanged verifier rejects the macOS and Windows
# wheels (run 38178165022). This file is pypi-publish.yml with two changes:
#   1. Both jobs check out the reviewed manifest commit dc18bdd (main, PR #340)
#      instead of the tag.
#   2. A guard fails unless dc18bdd's kit scripts, actions and pypi-publish.yml
#      are byte-identical to v0.7.0, and the manifest differs from the tag only
#      in the wheels line.
# The release tag, assets, verifier, uploader, environment and secret are the
# kit's own and are unchanged.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Python package repository'
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - production

permissions:
  contents: read

env:
  RELEASE_TAG: v0.7.0
  MANIFEST_REF: dc18bdd612cce0541e4529f5cc2bd31ff017dfd0

concurrency:
  group: publish-pypi-${{ inputs.target }}-v0.7.0
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-latest
    outputs:
      pypi_config: ${{ steps.config.outputs.config }}
      python_upload_tool: ${{ steps.config.outputs.python_upload_tool }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.MANIFEST_REF }}
          fetch-depth: 0
      - name: Guard - only the reviewed manifest differs from the tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git diff --exit-code "${RELEASE_TAG}" HEAD -- .github/scripts .github/actions .github/workflows/pypi-publish.yml
          test "$(git diff --numstat "${RELEASE_TAG}" HEAD -- release/publish-artifacts.toml)" = "$(printf '1\t1\trelease/publish-artifacts.toml')"
          git diff -U0 "${RELEASE_TAG}" HEAD -- release/publish-artifacts.toml | grep -Eq '^\+wheels = '
      - uses: ./.github/actions/verify-published-release
        with:
          release_tag: ${{ env.RELEASE_TAG }}
      - id: config
        name: Read PyPI channel configuration from release manifest
        shell: bash
        run: |
          set -euo pipefail
          echo "config=$(python3 .github/scripts/release_artifacts.py channel-config --manifest release/publish-artifacts.toml --channel pypi)" >> "$GITHUB_OUTPUT"
          plan="$(python3 .github/scripts/release_artifacts.py build-plan --manifest release/publish-artifacts.toml)"
          echo "python_upload_tool=$(jq -r '.python_upload_tool' <<<"${plan}")" >> "$GITHUB_OUTPUT"

  publish:
    needs: verify-release
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'production' && 'pypi' || 'testpypi' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.MANIFEST_REF }}
      - name: Download Python assets from the published GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release-assets dist
          gh release download "${RELEASE_TAG}" --repo "${RELEASE_REPOSITORY}" \
            --pattern '*.whl' --pattern '*.tar.gz' --dir release-assets
      - name: Select and verify Python distributions
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/release_artifacts.py verify-python-release-assets \
            --manifest release/publish-artifacts.toml \
            --asset-dir release-assets \
            --copy-to dist
      - name: Select configured Python repository
        shell: bash
        env:
          CHANNEL_CONFIG: ${{ needs.verify-release.outputs.pypi_config }}
          PUBLISH_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          import os

          config = json.loads(os.environ["CHANNEL_CONFIG"])["channel"]
          key = "test_repository" if os.environ["PUBLISH_TARGET"] == "testpypi" else "production_repository"
          print(f"PYPI_REPOSITORY={config[key]}")
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Require the maturin uploader
        if: ${{ needs.verify-release.outputs.python_upload_tool != 'maturin' }}
        run: exit 1
      - name: Install maturin
        run: python -m pip install maturin==1.9.4
      - name: Publish manifest-declared wheels and sdists to TestPyPI
        if: ${{ inputs.target == 'testpypi' }}
        env:
          MATURIN_NON_INTERACTIVE: '1'
          MATURIN_PYPI_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: maturin upload --repository "${PYPI_REPOSITORY}" --non-interactive --skip-existing dist/*.whl dist/*.tar.gz
      - name: Publish manifest-declared wheels and sdists to PyPI
        if: ${{ inputs.target == 'production' }}
        env:
          MATURIN_NON_INTERACTIVE: '1'
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: maturin upload --repository "${PYPI_REPOSITORY}" --non-interactive --skip-existing dist/*.whl dist/*.tar.gz
