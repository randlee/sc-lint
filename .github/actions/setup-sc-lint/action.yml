name: Setup sc-lint
description: >-
  Install and verify the pinned sc-lint release and sibling analyzers, or an
  explicitly selected immutable source revision. Release defaults retain the
  shared ecosystem pin and .just utilities; source mode builds the same-commit
  Python wheel into the consumer .sc-lint/venv.
inputs:
  source-revision:
    description: Optional full immutable commit SHA; alternatively project.sc_lint_source_revision in the rendered release manifest
    required: false
    default: ""
  version:
    description: Released sc-lint version to install (deliberate ecosystem pin)
    required: false
    default: "0.4.0"
  repository:
    description: GitHub repository slug hosting sc-lint releases
    required: false
    default: "randlee/sc-lint"
runs:
  using: composite
  steps:
    - name: Resolve immutable sc-lint source (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        SC_LINT_SOURCE_REVISION_INPUT: ${{ inputs.source-revision }}
        SC_LINT_REPOSITORY: ${{ inputs.repository }}
      run: |
        if [ -n "$SC_LINT_SOURCE_REVISION_INPUT" ] || grep -q sc_lint_source_revision release/publish-artifacts.toml 2>/dev/null || [ -f .sc-lint/source-install.json ]; then
          python3 .github/scripts/setup_sc_lint_source.py resolve
        else
          echo 'SC_LINT_SOURCE_REVISION=' >> "$GITHUB_ENV"
        fi
    - name: Resolve immutable sc-lint source (Windows)
      if: runner.os == 'Windows'
      shell: python
      env:
        SC_LINT_SOURCE_REVISION_INPUT: ${{ inputs.source-revision }}
        SC_LINT_REPOSITORY: ${{ inputs.repository }}
      run: |
        import os
        from pathlib import Path
        import subprocess
        import sys
        manifest = Path('release/publish-artifacts.toml')
        declared = manifest.is_file() and 'sc_lint_source_revision' in manifest.read_text(encoding='utf-8')
        if os.environ.get('SC_LINT_SOURCE_REVISION_INPUT') or declared or Path('.sc-lint/source-install.json').exists():
            subprocess.run([sys.executable, '.github/scripts/setup_sc_lint_source.py', 'resolve'], check=True)
        else:
            with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
                output.write('SC_LINT_SOURCE_REVISION=\n')
    - name: Install immutable sc-lint source (Unix)
      if: runner.os != 'Windows' && env.SC_LINT_SOURCE_REVISION != ''
      shell: bash
      env:
        SC_LINT_SOURCE_REVISION_INPUT: ${{ inputs.source-revision }}
        SC_LINT_REPOSITORY: ${{ inputs.repository }}
      run: python3 .github/scripts/setup_sc_lint_source.py install
    - name: Install immutable sc-lint source (Windows)
      if: runner.os == 'Windows' && env.SC_LINT_SOURCE_REVISION != ''
      shell: cmd
      env:
        SC_LINT_SOURCE_REVISION_INPUT: ${{ inputs.source-revision }}
        SC_LINT_REPOSITORY: ${{ inputs.repository }}
      run: python .github/scripts/setup_sc_lint_source.py install
    - name: Install sc-lint release (Unix)
      if: runner.os != 'Windows' && env.SC_LINT_SOURCE_REVISION == ''
      shell: bash
      env:
        SC_LINT_VERSION: ${{ inputs.version }}
        SC_LINT_REPOSITORY: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        case "${RUNNER_OS}:${RUNNER_ARCH}" in
          Linux:X64) target="x86_64-unknown-linux-gnu" ;;
          macOS:X64) target="x86_64-apple-darwin" ;;
          macOS:ARM64) target="aarch64-apple-darwin" ;;
          *)
            echo "sc-lint setup: unsupported runner ${RUNNER_OS}/${RUNNER_ARCH}" >&2
            exit 1
            ;;
        esac
        archive="sc-lint_${SC_LINT_VERSION}_${target}.tar.gz"
        url="https://github.com/${SC_LINT_REPOSITORY}/releases/download/v${SC_LINT_VERSION}/${archive}"
        install_dir="${RUNNER_TEMP}/sc-lint-${SC_LINT_VERSION}/${target}"
        mkdir -p "${install_dir}"
        curl --fail --location --retry 4 --retry-all-errors --silent --show-error \
          --output "${RUNNER_TEMP}/${archive}" "${url}" || {
          echo "sc-lint setup: could not download ${url}; verify that release v${SC_LINT_VERSION} publishes this runner asset" >&2
          exit 1
        }
        tar -xzf "${RUNNER_TEMP}/${archive}" -C "${install_dir}"
        test -x "${install_dir}/sc-lint" || {
          echo "sc-lint setup: release archive is missing executable sc-lint" >&2
          exit 1
        }
        for backend in sc-lint-boundary sc-lint-portability sc-lint-runtime; do
          test -x "${install_dir}/${backend}" || {
            echo "sc-lint setup: release archive is missing sibling backend ${backend}" >&2
            exit 1
          }
        done
        echo "${install_dir}" >> "${GITHUB_PATH}"
    - name: Install sc-lint release (Windows)
      if: runner.os == 'Windows' && env.SC_LINT_SOURCE_REVISION == ''
      shell: python
      env:
        SC_LINT_VERSION: ${{ inputs.version }}
        SC_LINT_REPOSITORY: ${{ inputs.repository }}
      run: |
        import hashlib
        import os
        from pathlib import Path
        import urllib.request
        import zipfile
        if os.environ['RUNNER_ARCH'] != 'X64':
            raise RuntimeError('sc-lint setup: unsupported Windows architecture')
        version, repository = os.environ['SC_LINT_VERSION'], os.environ['SC_LINT_REPOSITORY']
        target = 'x86_64-pc-windows-msvc'
        archive = f'sc-lint_{version}_{target}.zip'
        base = f'https://github.com/{repository}/releases/download/v{version}'
        with urllib.request.urlopen(f'{base}/checksums.txt') as response:
            checksums = response.read().decode('utf-8')
        expected = next((parts[0] for line in checksums.splitlines() if len(parts := line.split()) >= 2 and parts[1].lstrip('*') == archive), None)
        with urllib.request.urlopen(f'{base}/{archive}') as response:
            contents = response.read()
        if not expected or hashlib.sha256(contents).hexdigest().lower() != expected.lower():
            raise RuntimeError(f'sc-lint setup: checksum failed for {archive}')
        destination = Path(os.environ['RUNNER_TEMP']) / f'sc-lint-{version}' / target
        destination.mkdir(parents=True, exist_ok=True)
        archive_path = Path(os.environ['RUNNER_TEMP']) / archive
        archive_path.write_bytes(contents)
        with zipfile.ZipFile(archive_path) as package:
            for member in package.infolist():
                if not (destination / member.filename).resolve().is_relative_to(destination.resolve()):
                    raise RuntimeError('sc-lint setup: unsafe archive path')
            package.extractall(destination)
        for binary in ('sc-lint.exe', 'sc-lint-boundary.exe', 'sc-lint-portability.exe', 'sc-lint-runtime.exe'):
            if not (destination / binary).is_file():
                raise RuntimeError(f'sc-lint setup: release archive is missing sibling backend {binary}')
        with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as output:
            output.write(str(destination) + '\n')
    - name: Verify sc-lint version contract
      if: runner.os != 'Windows' && env.SC_LINT_SOURCE_REVISION == ''
      shell: bash
      env:
        SC_LINT_VERSION: ${{ inputs.version }}
        SC_LINT_REPOSITORY: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        version_json="$(sc-lint version --json)"
        jq -e --arg expected "${SC_LINT_VERSION}" \
          '.ok == true and .data.crate_version == $expected' \
          <<<"${version_json}" >/dev/null || {
          echo "sc-lint setup: version contract failed; expected ${SC_LINT_VERSION}" >&2
          exit 1
        }
    - name: Verify sc-lint version contract (Windows)
      if: runner.os == 'Windows' && env.SC_LINT_SOURCE_REVISION == ''
      shell: python
      env:
        SC_LINT_VERSION: ${{ inputs.version }}
        SC_LINT_REPOSITORY: ${{ inputs.repository }}
      run: |
        import json
        import os
        import subprocess
        value = json.loads(subprocess.check_output(['sc-lint', 'version', '--json'], text=True))
        if not value.get('ok') or value.get('data', {}).get('crate_version') != os.environ['SC_LINT_VERSION']:
            raise RuntimeError(f"sc-lint setup: expected version {os.environ['SC_LINT_VERSION']}")
    - name: Materialize pinned sc-lint Python utilities (Unix)
      if: runner.os != 'Windows' && env.SC_LINT_SOURCE_REVISION == ''
      shell: bash
      env:
        SC_LINT_VERSION: ${{ inputs.version }}
        SC_LINT_REPOSITORY: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        archive="${RUNNER_TEMP}/sc-lint-source-${SC_LINT_VERSION}.tar.gz"
        source_root="${RUNNER_TEMP}/sc-lint-source-${SC_LINT_VERSION}"
        mkdir -p "${source_root}"
        curl --fail --location --retry 4 --retry-all-errors --silent --show-error \
          --output "${archive}" \
          "https://github.com/${SC_LINT_REPOSITORY}/archive/refs/tags/v${SC_LINT_VERSION}.tar.gz"
        tar -xzf "${archive}" -C "${source_root}" --strip-components=1
        mkdir -p "${GITHUB_WORKSPACE}/.just"
        cp "${source_root}/.just/"*.py "${GITHUB_WORKSPACE}/.just/"
        printf '%s\n' "${SC_LINT_VERSION}" > "${GITHUB_WORKSPACE}/.just/.sc-lint-runtime-version"
        test -f "${GITHUB_WORKSPACE}/.just/run_lint.py"
    - name: Materialize pinned sc-lint Python utilities (Windows)
      if: runner.os == 'Windows' && env.SC_LINT_SOURCE_REVISION == ''
      shell: python
      env:
        SC_LINT_VERSION: ${{ inputs.version }}
        SC_LINT_REPOSITORY: ${{ inputs.repository }}
      run: |
        import io
        import os
        from pathlib import Path
        import urllib.request
        import zipfile
        version, repository = os.environ['SC_LINT_VERSION'], os.environ['SC_LINT_REPOSITORY']
        with urllib.request.urlopen(f'https://github.com/{repository}/archive/refs/tags/v{version}.zip') as response:
            contents = response.read()
        just_root = Path(os.environ['GITHUB_WORKSPACE']) / '.just'
        just_root.mkdir(parents=True, exist_ok=True)
        with zipfile.ZipFile(io.BytesIO(contents)) as package:
            for name in package.namelist():
                parts = Path(name).parts
                if len(parts) == 3 and parts[1] == '.just' and parts[2].endswith('.py'):
                    (just_root / parts[2]).write_bytes(package.read(name))
        (just_root / '.sc-lint-runtime-version').write_text(version, encoding='utf-8')
        if not (just_root / 'run_lint.py').is_file():
            raise RuntimeError('sc-lint setup: source archive is missing .just/run_lint.py')
    - name: Smoke-test repository root discovery (Unix)
      if: runner.os != 'Windows' && env.SC_LINT_SOURCE_REVISION == ''
      shell: bash
      run: |
        set -euo pipefail
        root="${GITHUB_WORKSPACE:-${PWD}}"
        smoke_json="$(sc-lint --json --root "${root}" lint sc-boundary)"
        jq -e '.ok == true and (.error.code // "") != "CLI.CONFIG_ERROR"' \
          <<<"${smoke_json}" >/dev/null || {
          echo "sc-lint setup: root discovery failed or returned CLI.CONFIG_ERROR" >&2
          exit 1
        }
    - name: Smoke-test repository root discovery (Windows)
      if: runner.os == 'Windows' && env.SC_LINT_SOURCE_REVISION == ''
      shell: python
      run: |
        import json
        import os
        import subprocess
        root = os.environ.get('GITHUB_WORKSPACE', os.getcwd())
        value = json.loads(subprocess.check_output(['sc-lint', '--json', '--root', root, 'lint', 'sc-boundary'], text=True))
        if not value.get('ok') or value.get('error', {}).get('code') == 'CLI.CONFIG_ERROR':
            raise RuntimeError(f'sc-lint root discovery failed: {value}')
    - name: Verify source sc-lint consumer semantics (Unix)
      if: runner.os != 'Windows' && env.SC_LINT_SOURCE_REVISION != ''
      shell: bash
      env:
        SC_LINT_SOURCE_REVISION_INPUT: ${{ inputs.source-revision }}
      run: python3 .github/scripts/setup_sc_lint_source.py smoke
    - name: Verify source sc-lint consumer semantics (Windows)
      if: runner.os == 'Windows' && env.SC_LINT_SOURCE_REVISION != ''
      shell: cmd
      env:
        SC_LINT_SOURCE_REVISION_INPUT: ${{ inputs.source-revision }}
      run: python .github/scripts/setup_sc_lint_source.py smoke
