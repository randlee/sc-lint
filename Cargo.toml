[workspace]
members = [
  "crates/sc-lint",
  "crates/sc-lint-directives",
  "crates/sc-lint-attributes",
  "crates/sc-lint-boundary",
  "crates/sc-lint-portability",
  "crates/sc-lint-runtime",
  "crates/sc-lint-schema",
  "crates/sc-lint-analyzer-support",
  "bindings/sc-lint-py",
]
resolver = "2"

[workspace.package]
version = "0.8.3"
edition = "2024"
authors = ["Rand Lee"]
license = "MIT"
repository = "https://github.com/randlee/sc-lint"
homepage = "https://github.com/randlee/sc-lint"
rust-version = "1.94.1"

[workspace.dependencies]
anyhow = "1.0.104"
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
etcetera = "0.11.0"
sc-observability = "1.5.0"
sc-lint-boundary = { version = "0.8.3", path = "crates/sc-lint-boundary" }
sc-lint-directives = { version = "0.8.3", path = "crates/sc-lint-directives" }
sc-lint-schema = { version = "0.8.3", path = "crates/sc-lint-schema" }
sc-lint-analyzer-support = { version = "0.8.3", path = "crates/sc-lint-analyzer-support" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
semver = "1.0.28"
rayon = "1.12.0"
toml = "1.1.8"
