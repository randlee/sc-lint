# Agent registry for plan-anchoring. Paths are relative to the plugin root.
agents:
  anchor-plan-review:
    version: 0.4.0
    path: .claude/agents/anchor-plan-review.md
  anchor-sprint-review:
    version: 0.4.0
    path: .claude/agents/anchor-sprint-review.md
  anchor-tuning:
    version: 0.4.2
    path: .claude/agents/anchor-tuning.md

skills:
  plan-anchoring:
    version: 0.4.5
    path: skills/plan-anchoring/SKILL.md
    depends_on:
      anchor-plan-review: "0.x"
      anchor-sprint-review: "0.x"
      anchor-tuning: "0.x"
