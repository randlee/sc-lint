[graph]
all-features = false
no-default-features = false

[advisories]
yanked = "deny"
ignore = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
# cargo-deny rejects unknown licenses unless clarified and denies licenses not
# listed below.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]
