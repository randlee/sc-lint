[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "sc-lint"
version = "0.8.5"
description = "Python bindings and repository helpers for the sc-lint Rust linting tool."
readme = "README.md"
dependencies = ["codespell>=2.2"]

license = "MIT"
requires-python = ">=3.9"
keywords = ["rust", "lint", "static-analysis", "code-quality", "repository-policy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "rdflib>=7,<8", "Jinja2>=3.1,<4", "PyYAML>=6,<7", "sc-compose==1.5.0"]

[project.urls]
Homepage = "https://github.com/randlee/sc-lint"
Repository = "https://github.com/randlee/sc-lint"
Documentation = "https://github.com/randlee/sc-lint/blob/main/docs/sc-lint/python-bindings.md"
Issues = "https://github.com/randlee/sc-lint/issues"
Changelog = "https://github.com/randlee/sc-lint/blob/main/CHANGELOG.md"

[tool.maturin]
python-source = "python"
module-name = "sc_lint._native"
features = ["python-extension"]
manifest-path = "Cargo.toml"
exclude = [
  "**/*.pyc",
  "**/test_consumer_contract.py",
  "**/test_consumer_lifecycle.py",
  "**/test_orchestration_contracts.py",
  "**/test_release_artifacts.py",
]
