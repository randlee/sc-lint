[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "sc-lint"
description = "sc-lint Python bindings and repository helper package."
readme = "README.md"
dependencies = ["codespell>=2.2"]

license = { text = "MIT" }
requires-python = ">=3.9"
dynamic = ["version"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "rdflib>=7,<8", "Jinja2>=3.1,<4", "PyYAML>=6,<7"]

[project.urls]
Homepage = "https://github.com/randlee/sc-lint"
Repository = "https://github.com/randlee/sc-lint"

[tool.maturin]
python-source = "python"
module-name = "sc_lint._native"
features = ["python-extension"]
manifest-path = "Cargo.toml"
exclude = [
  "python/sc_lint/tests/test_consumer_contract.py",
  "python/sc_lint/tests/test_consumer_lifecycle.py",
  "python/sc_lint/tests/test_orchestration_contracts.py",
  "python/sc_lint/tests/test_release_artifacts.py",
]
