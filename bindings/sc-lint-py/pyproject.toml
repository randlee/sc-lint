[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "sc-lint"
description = "sc-lint Python bindings and repository helper package."
readme = "README.md"
dependencies = ["codespell>=2.2"]
license = { text = "MIT" }
requires-python = ">=3.9"
dynamic = ["version"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Homepage = "https://github.com/randlee/sc-lint"
Repository = "https://github.com/randlee/sc-lint"

[tool.maturin]
python-source = "python"
module-name = "sc_lint._native"
features = ["python-extension"]
manifest-path = "Cargo.toml"
